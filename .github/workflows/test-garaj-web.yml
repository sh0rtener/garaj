name: Build and Run Garaj Web (Angular)

on:
  push:
    branches: ["main"]
    paths:
      - "src/clients/garaj-web/**"
  pull_request:
    branches: ["main"]
    paths:
      - "src/clients/garaj-web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients/garaj-web

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/clients/garaj-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: Smoke test — run built app
        run: |
          npx http-server dist/garaj-web/browser -p 4200 &
          SERVER_PID=$!
          sleep 5
          curl --fail http://localhost:4200 || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID